name: 🔐 ISM — Scheduled Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'  # Todo domingo às 03:00 UTC (domingo 00:00 BRT)
  workflow_dispatch:
    inputs:
      audit_type:
        description: 'Tipo de auditoria'
        required: false
        default: 'full'
        type: choice
        options: [full, quick, emergency]

jobs:
  scheduled-secret-scan:
    name: 🔒 Scheduled Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v8.18.4
      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --report-format json \
            --report-path scheduled-gitleaks.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-gitleaks-report
          path: scheduled-gitleaks.json
          retention-days: 14

  scheduled-dependency-audit:
    name: 📦 Scheduled Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm audit --json > audit-root.json || true
      - run: cd admin && npm ci && npm audit --json > ../audit-admin.json || true
      - run: cd functions && npm ci && npm audit --json > ../audit-functions.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-dependency-reports
          path: audit-*.json
          retention-days: 14

  scheduled-iac-scan:
    name: 🏗️ Scheduled IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || true
      - run: npx ts-node scripts/iac-security-audit.ts --output scheduled-iac-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-iac-report
          path: scheduled-iac-audit.json
          retention-days: 14

  scheduled-security-tests:
    name: 🔐 Scheduled Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || true
      - run: |
          npx vitest run src/services/auth-security.test.ts src/services/rbac-security.test.ts src/services/api-security.test.ts src/services/http-security.test.ts src/services/rls-security.test.ts src/services/tenant-isolation.test.ts src/services/regression-security.test.ts src/services/secrets-management.test.ts --reporter=json --outputFile=scheduled-security-tests.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-security-tests-report
          path: scheduled-security-tests.json
          retention-days: 14

  generate-security-report:
    name: 📊 Generate Security Report
    runs-on: ubuntu-latest
    needs: [scheduled-secret-scan, scheduled-dependency-audit, scheduled-iac-scan, scheduled-security-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Run Gate Engine in Report-Only mode
        run: |
          npx ts-node scripts/security-gate-engine.ts \
            --dry-run \
            --commit ${{ github.sha }} \
            --branch ${{ github.ref_name }} \
            --version "Scheduled-${{ github.run_number }}" \
            --scanner-results artifacts > scheduled-report.txt 2>&1 || true
          cat scheduled-report.txt
      - name: Publish Summary
        run: |
          echo "## Scheduled Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat scheduled-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
