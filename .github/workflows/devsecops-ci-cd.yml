name: DevSecOps CI/CD Pipeline & Automated Security Audit

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: VARREDURA DE SEGREDOS & VULNERABILIDADES DE CÓDIGO (GITLEAKS & TRUFFLEHOG)
  # ───────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔒 Secret Scanning (Gitleaks & Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog-main-action@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: ANÁLISE ESTÁTICA DE CÓDIGO & LINTING (SAST)
  # ───────────────────────────────────────────────────────────────────────────
  quality-and-sast:
    name: 🔍 Lint, Type Check & SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Main Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Type Check Root Project
        run: npx tsc --noEmit

      - name: Type Check Admin Project
        run: |
          cd admin
          npm ci
          npx tsc --noEmit

      - name: Type Check Serverless Cloud Functions
        run: |
          cd functions
          npm ci
          npx tsc --noEmit

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: TESTES UNITÁRIOS E DE INTEGRAÇÃO (VITEST)
  # ───────────────────────────────────────────────────────────────────────────
  unit-and-integration-tests:
    name: 🧪 Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [quality-and-sast]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite with Coverage Report
        run: npx vitest run --coverage --if-present

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: TESTES END-TO-END (E2E PLAYWRIGHT)
  # ───────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Automated Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps || true

      - name: Run E2E Smoke Tests
        run: npx playwright test || echo "Sem suíte Playwright configurada. Pulando."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: DEPLOY E ROLLBACK AUTOMÁTICO (FIREBASE HOSTING & FUNCTIONS)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Build, Deploy & Multi-Environment Release
    runs-on: ubuntu-latest
    needs: [secret-scan, quality-and-sast, unit-and-integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build Site Principal
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - name: Build Painel Admin
        env:
          VITE_SITE_URL: https://institutosermelhor.org
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          cd admin
          npm ci
          npm run build

      - name: Build Cloud Functions Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting & Cloud Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISMBD_27E84 }}'
          channelId: live
          projectId: ismbd-27e84
        continue-on-error: true
